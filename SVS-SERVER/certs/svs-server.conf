    [ req ]
    prompt                 = no
    default_bits           = 2048
    default_md             = sha256
    distinguished_name     = dn
    req_extensions         = v3_req

    [ dn ]
    C  = FR
    ST = CRETEIL
    L  = CRETEIL
    O  = UPEC
    OU = LS
    CN = svs-server.localhost

    [ v3_req ]
    basicConstraints       = CA:FALSE
    keyUsage               = digitalSignature, keyEncipherment
    extendedKeyUsage       = serverAuth, clientAuth
    subjectAltName         = @sans

    [ sans ]
    DNS.1 = svs-server.localhost
