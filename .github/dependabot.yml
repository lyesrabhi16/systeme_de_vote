version: 2
updates:
  - package-ecosystem: pip
    directory: /SVS-SERVER
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directory: /SVS-CLIENT
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
