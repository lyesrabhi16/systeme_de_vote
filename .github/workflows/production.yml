name: Production
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@635640504f6d7197d3bb29876a652f671028dc97
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install
        working-directory: SVS-CLIENT
      - name: Deploy
        run: make deploy
        working-directory: SVS-SERVER
