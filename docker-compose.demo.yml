# Try the project with one command, no certificate and no mail server:
#
#     docker compose -f docker-compose.demo.yml up --build
#
# Open http://localhost:8000 . The accounts are printed in the logs of `svs` (password: demo-password-123),
# and so is the one-time password of every sign-in (there is no mail server: the "email" is written to the log).
#
# The finished election can be checked from the public data only:  docker compose -f docker-compose.demo.yml exec svs python -m app.utils.audit http://localhost:8000 2
#
# This is for looking at the project, not for running it: ENV_MODE=development, plain http, demo secrets. See docker-compose.yml for the real thing.
name: svs-demo

services:
  svs:
    build: .
    environment:
      ENV_MODE: development
      HOST_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:8000
      DB_HOST: db
      DB_USER: svs
      DB_PASSWORD: svs-demo-db-password
      DB_NAME: svs
      REDIS_HOST: redis
      # no SMTP_HOST: emails are written to the log. no JWT_SECRET_KEY / ENCRYPTION_KEY: made up when the container starts (so the demo's elections can be counted only until it restarts)
    # the demo data first (it does nothing when there is data already), then the server
    command: ["sh", "-c", "python -m app.db.seed_demo && exec uvicorn app.main:APP --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: svs
      POSTGRES_PASSWORD: svs-demo-db-password
      POSTGRES_DB: svs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svs -d svs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
