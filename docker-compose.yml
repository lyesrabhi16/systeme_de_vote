# The deployment: the application behind Traefik, with HTTPS, PostgreSQL and Redis that nothing outside can reach.
#
#     cp .env.example .env            # then fill it in (every secret is required: the stack refuses to start without)
#     make -C SVS-SERVER generate-certs   # a local CA and a certificate for DOMAIN (or use Let's Encrypt, see below)
#     docker compose up -d --build
#
# To look at the project without any of this, use docker-compose.demo.yml.
name: svs

x-secure: &secure
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  svs:
    <<: *secure
    build: .
    env_file: .env
    environment:
      ENV_MODE: production
      DB_HOST: db
      DB_USER: svs
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: svs
      REDIS_HOST: redis
      # the only way to this container is Traefik (nothing is published), so it may be believed about the visitor's address
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, web]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - svs-logs:/srv/logs
    labels:
      - traefik.enable=true
      - traefik.docker.network=svs_web
      - traefik.http.routers.svs.rule=Host(`${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.svs.entrypoints=websecure
      - traefik.http.routers.svs.tls=true
      - traefik.http.routers.svs.middlewares=svs-headers
      - traefik.http.services.svs.loadbalancer.server.port=8000
      - traefik.http.middlewares.svs-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.svs-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.svs-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.svs-headers.headers.frameDeny=true
      # With a real domain, let Traefik get a certificate (and drop the `tls.yml` and certs lines of `traefik` below):
      #   - traefik.http.routers.svs.tls.certresolver=letsencrypt
      # and add to the command of `traefik`:
      #   --certificatesresolvers.letsencrypt.acme.email=you@example.org
      #   --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      #   --certificatesresolvers.letsencrypt.acme.tlschallenge=true

  db:
    <<: *secure
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: svs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: svs
    volumes:
      - svs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svs -d svs"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    <<: *secure
    image: redis:8-alpine
    # one-time passwords and login steps live here for a few minutes: no persistence is needed, and a password is
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  traefik:
    <<: *secure
    image: traefik:v3.6
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/tls.yml
      # no dashboard and no API: nothing to expose
      - --api=false
      - --log.level=INFO
      - --accesslog=false   # an access log would say who voted when
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Traefik reads the containers' labels through the Docker socket: whoever controls Traefik controls Docker. It is
      # read-only and nothing else is mounted; for more isolation put a docker-socket-proxy in front of it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./SVS-SERVER/certs:/certs:ro
      - ./SVS-SERVER/tls.yml:/etc/traefik/tls.yml:ro
    networks: [web]

networks:
  # internal: no route to the outside, and nothing published: only the application reaches the database and Redis
  internal:
    internal: true
  web:

volumes:
  svs-db-data:
  svs-logs:
